name: komorebi
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-180000}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    init: true
  ollama:
    image: ollama/ollama:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  model-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec ollama pull "$$OLLAMA_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: on-failure
volumes:
  ollama-models:
